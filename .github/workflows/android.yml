
name: Gerar APK Agenda Arretada

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgendaArretada_Projeto_Android_Teste.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          unzip AgendaArretada_Projeto_Android_Teste.zip
          echo "PROJECT_DIR=AgendaArretada_Android_Teste" >> "$GITHUB_ENV"

      - name: Compilar APK de teste
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Agenda-Arretada-APK-Teste
          path: AgendaArretada_Android_Teste/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
